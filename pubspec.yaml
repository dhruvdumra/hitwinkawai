name: kawai_chan  
description: A personal memories app for twin
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  video_player: ^2.8.2
  http: ^1.1.0
  audioplayers: ^6.5.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png" 
  remove_alpha_ios: true  

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/thumbnails/   
    - assets/audio/background_music.mp3
    - assets/icon/  # ADD THIS LINE
